name: TradeAnalyze Daily Run

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Bangkok (UTC+7)
  workflow_dispatch:

jobs:
  run-bot:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}



      USE_V3: true                # 👈 Run V3 with all institutional upgrades
      # Optional: override specific phases if needed
      # V3_PHASES_WALK_FORWARD: true
      # V3_PHASES_QUANTILE_FORECAST: true
      # etc.

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check Secrets
        run: |
          test -n "$SHEET_ID"
          test -n "$GOOGLE_CREDENTIALS"
          test -n "$LINE_TOKEN"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise signal database (V3)
        run: |
          python -c "from engines.signal_tracker import SignalDatabase; SignalDatabase()"

      - name: Debug
        run: |
          echo "===== START ====="
          date -u
          python --version
          pip --version
          echo "Running with USE_V3=$USE_V3"

      - name: Run TradeAnalyze
        run: |
          python main.py | tee trade.log

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-log
          path: trade.log