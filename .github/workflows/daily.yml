name: TradeAnalyze Daily Run

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Bangkok
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      USE_V3: true
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        run: |
          if [ -z "$SHEET_ID" ]; then echo "Missing SHEET_ID"; exit 1; fi
          if [ -z "$GOOGLE_CREDENTIALS" ]; then echo "Missing GOOGLE_CREDENTIALS"; exit 1; fi
          if [ -z "$LINE_TOKEN" ]; then echo "Missing LINE_TOKEN"; exit 1; fi
          echo "✅ Secrets OK"

      - name: Install V3 dependencies (including ML)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy hmmlearn scikit-learn xgboost lightgbm requests gspread google-auth python-dotenv
          # Verify installations
          python -c "import xgboost, lightgbm, hmmlearn; print('ML libs OK')"

      - name: Create requirements.txt (if missing)
        run: |
          if [ ! -f requirements.txt ]; then
            echo "Creating requirements.txt from installed packages"
            pip freeze > requirements.txt
          fi

      - name: Initialise signal database (V3)
        run: |
          python -c "
from engines.signal_tracker import SignalDatabase
import sqlite3
try:
    db = SignalDatabase()
    print('✅ signals.db initialised')
except Exception as e:
    print(f'⚠️ DB init: {e}')
"

      - name: Run TradeAnalyze with full traceback
        run: |
          set -e
          python main.py 2>&1 | tee trade.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ Failed with code $exit_code"
            echo "Last 30 lines of log:"
            tail -30 trade.log
            exit $exit_code
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trade-log-error
          path: trade.log

      - name: Upload log always (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-log-complete
          path: trade.log