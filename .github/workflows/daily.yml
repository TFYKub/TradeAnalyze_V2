name: TradeAnalyze Daily Run

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Bangkok (UTC+7)
  workflow_dispatch:

jobs:
  run-bot:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      USE_V3: true                # 👈 Run V3 with all institutional upgrades
      PYTHONUNBUFFERED: 1        # Show print statements immediately

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check Secrets
        run: |
          test -n "$SHEET_ID" || { echo "Missing SHEET_ID"; exit 1; }
          test -n "$GOOGLE_CREDENTIALS" || { echo "Missing GOOGLE_CREDENTIALS"; exit 1; }
          test -n "$LINE_TOKEN" || { echo "Missing LINE_TOKEN"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found – installing minimal V3 dependencies"
            pip install pandas numpy yfinance scipy hmmlearn scikit-learn xgboost lightgbm requests gspread google-auth python-dotenv
          fi

      - name: Verify critical imports
        run: |
          python -c "
import sys
missing = []
for pkg in ['pandas', 'numpy', 'yfinance', 'scipy', 'hmmlearn', 'xgboost', 'lightgbm', 'gspread', 'google.auth']:
    try:
        __import__(pkg)
    except ImportError:
        missing.append(pkg)
if missing:
    print(f'Missing packages: {missing}')
    sys.exit(1)
print('✅ All critical imports OK')
"

      - name: Initialise signal database (V3)
        run: |
          python -c "
from engines.signal_tracker import SignalDatabase
try:
    SignalDatabase()
    print('✅ Database initialised')
except Exception as e:
    print(f'⚠️ Database init warning (may already exist): {e}')
"

      - name: Debug environment
        run: |
          echo "===== START ====="
          date -u
          python --version
          pip --version
          echo "Running with USE_V3=$USE_V3"

      - name: Run TradeAnalyze
        run: |
          python main.py 2>&1 | tee trade.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ TradeAnalyze failed with exit code $exit_code"
            tail -50 trade.log
            exit $exit_code
          fi

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-log
          path: trade.log