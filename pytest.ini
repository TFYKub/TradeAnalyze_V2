[pytest]
# TradeAnalyze v2.0 — pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# Custom markers
markers =
    unit: Pure unit tests — no network, no I/O (fast)
    integration: Integration tests — mocked I/O (medium)
    live: Live network tests — requires API keys (slow, opt-in only)
    slow: Tests that take > 1s

# Ignore patterns
norecursedirs =
    .git
    __pycache__
    .venv
    venv
    venv_v2
    node_modules

# Minimum version
minversion = 7.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:yfinance
    ignore::RuntimeWarning:numpy
